services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-app_db}
      POSTGRES_USER: ${POSTGRES_USER:-app_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: src/App.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__PostgreSQL: Host=postgres;Port=5432;Database=${POSTGRES_DB:-app_db};Username=${POSTGRES_USER:-app_user};Password=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      Cors__AllowedOrigins__0: ${WEB_ORIGIN:-http://localhost:5173}
      Cors__AllowedOrigins__1: ${LAN_WEB_ORIGIN:-http://10.186.76.241:5173}
      Database__ApplyMigrations: true
      HttpsRedirection__Enabled: false
      Jwt__Issuer: App.Api
      Jwt__Audience: App.Web
      Jwt__SigningKey: ${JWT_SIGNING_KEY:-development-only-signing-key-change-before-production-2026}
      Jwt__ExpirationMinutes: 60
      InitialAdmin__Enabled: true
      InitialAdmin__Email: ${INITIAL_ADMIN_EMAIL:-admin@admin.com}
      InitialAdmin__Password: ${INITIAL_ADMIN_PASSWORD:-admin123}
      InitialAdmin__FirstName: Admin
      InitialAdmin__LastName: Admin
      Gemini__ApiKey: ${GEMINI_API_KEY:-}
      Gemini__Model: ${GEMINI_MODEL:-gemini-3.5-flash-lite}
      Gemini__TimeoutSeconds: ${GEMINI_TIMEOUT_SECONDS:-25}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
